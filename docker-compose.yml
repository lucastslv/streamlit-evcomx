services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: evcomx-carga-alta:latest
    container_name: evcomx-carga-alta
    ports:
      - "8501:8501"
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
