services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: evcomx-carga-alta:latest
    restart: unless-stopped
    expose:
      - "8501"
    environment:
      - TZ=America/Sao_Paulo
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
